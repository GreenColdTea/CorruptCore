name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install hmm and Dependencies
        run: |
          haxelib setup ~/haxelib
          # Устанавливаем сам менеджер зависимостей
          haxelib --global install hmm
          haxelib --global run hmm setup
          
          # Устанавливаем всё, что прописано в hmm.json
          haxelib run hmm install
          
          # На всякий случай явно настраиваем lime (обычно hmm делает это сам)
          haxelib run lime setup flixel
          
          haxelib list

      - name: Compile
        run: haxelib run lime build linux
        
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'


  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
          
      - name: Install hmm and Dependencies
        run: |
          haxelib setup C:/haxelib
          haxelib --global install hmm
          haxelib --global run hmm setup
          haxelib run hmm install
          haxelib run lime setup flixel
          haxelib list
        shell: cmd

      - name: Compile
        run: haxelib run lime build windows
        shell: cmd
        
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin


  buildMac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
          
      - name: Install hmm and Dependencies
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          haxelib run hmm install
          haxelib run lime setup flixel
          haxelib list

      - name: Compile
        run: haxelib run lime build mac
        
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin