name: Build
on:
  push:
    
  pull_request:

  workflow_dispatch:

jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install hmm and Dependencies
        run: |
          haxelib setup ~/haxelib
          
          haxelib --global install hmm
          haxelib --global run hmm setup
          
          echo "Installing dependencies via hmm..."
          haxelib run hmm install > hmm_install.log 2>&1 || (cat hmm_install.log && exit 1)
          
          echo "Setting up lime..."
          haxelib run lime setup flixel > lime_setup.log 2>&1 || (cat lime_setup.log && exit 1)
          
          echo "Dependencies installed successfully!"

      - name: Compile
        run: haxelib run lime build Project.xml linux
        
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'

  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Set HAXEPATH
        run: echo "HAXEPATH=$Env:HAXE_STD_PATH\.." >> $Env:GITHUB_ENV
        shell: pwsh

      - name: Install hmm and Dependencies
        run: |
          haxelib setup C:/haxelib
          
          haxelib --global install hmm
          haxelib --global run hmm setup
          
          echo Installing dependencies via hmm...
          haxelib run hmm install > hmm_install.log 2>&1
          if errorlevel 1 (
              type hmm_install.log
              exit /b 1
          )
          
          echo Setting up lime...
          haxelib run lime setup flixel > nul 2>&1
          
          echo Dependencies installed successfully!
        shell: cmd

      - name: Compile
        run: haxelib run lime build windows
        shell: cmd
        
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildMac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install hmm and Dependencies
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          
          echo "Installing dependencies via hmm..."
          haxelib run hmm install > hmm_install.log 2>&1 || (cat hmm_install.log && exit 1)
          
          echo "Setting up lime..."
          haxelib run lime setup flixel > lime_setup.log 2>&1 || (cat lime_setup.log && exit 1)
          
          echo "Dependencies installed successfully!"

      - name: Compile
        run: haxelib run lime build mac
        
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin